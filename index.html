<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        body {
            
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .answers {
            list-style-type: none;
            padding: 0;
        }
        .answers li {
            margin-bottom: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            font-size: 1.2em;
            margin-top: 20px;
        }
        #new-test {
            display: none;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="quiz-container">
        <div id="quiz"></div>
        <button id="submit">Submit Quiz</button>
        <button id="new-test">New Test</button>
        <div id="result" class="result"></div>
    </div>

<script>
    const questionSets= [
        [
            {
                question: "What do you call fake spagehtti?",
                A: "An Accomplishment",
                B: "Sensational",
                C: "Fetteccine Al-fake-o",
                D: "An Impasta!",
                correct: "D"
            },
            {
                question: "What goes around the world but never moves?",
                A: "Grass",
                B: "Water",
                C: "The Sun",
                D: "The Equator",
                correct: "D" 
            },
            {
                question: "What is full of holes but can still contain water?",
                A: "Swiss Cheese",
                B: "A Bucket",
                C: 'A "Netflix Original" Action Movie',
                D: "A Holy Cup",
                correct: "C" 
            }
        ],
        [
            {
                question: 'In a website browser address bar, what does "www" stand for?',
                A: "Wendy's Winter Wonderland",
                B: "Wicked Wicked Wicked",
                C: "World Wide Web",
                D: "Web World Wide",
                correct: "C"
            },
            {
                question: "What is the tiny piece at the end of a shoelace called?",
                A: "Lace Tip",
                B: "An Aglet",
                C: "String End",
                D: "Plastic",
                correct: "B" 
            },
            {
                question: "Originally, Amazon only sold what kind of product?",
                A: "Water",
                B: "Livestock",
                C: "Clothes",
                D: "Books",
                correct: "D" 
            }
        ],
        [
            {
                question: "Who painted the Mona Lisa?",
                A: "Leonardo da Vinci",
                B: "Leonardo DiCaprio",
                C: "Leon Da Vinny",
                D: "Leonious Ceaser",
                correct: "A"
            },
            {
                question: "Chrome, Safari, Firefox and Explorer are different types of what?",
                A: "Web browsers",
                B: "Internet",
                C: "Routers",
                D: "Personality Types",
                correct: "A" 
            },
            {
                question: "What is the human body's heaviest organ?",
                A: "Heart",
                B: "Stomach",
                C: "Skin",
                D: "Spleen",
                correct: "C" 
            }
        ]
    ];

    let currentSetIndex = 0;
    let quizData = questionSets[currentSetIndex];

    const quizContainer = document.getElementById('quiz');
    const resultContainer = document.getElementById('result');
    const submitButton = document.getElementById('submit');
    const newTestButton = document.getElementById('new-test');

    function loadQuiz() {
        const output = [];

        quizData.forEach((currentQuestion, questionNumber) => {
            const answers = [];
            for(const letter in currentQuestion) {
                if (letter !== 'question' && letter !== 'correct') {
                    answers.push(
                        `<li> 
                            <label>
                                <input type="radio" name="question${questionNumber}" value="${letter}">
                                ${letter} : ${currentQuestion[letter]}
                            </label>
                        </li>`
                    );
                }
            }
            output.push(
                `<div class ="question">${currentQuestion.question}</div>
                <ul class="answers">${answers.join('')}</ul>`
            )
        });

        quizContainer.innerHTML = output.join('');
    }

    function showResults() {
        const answerContainers = quizContainer.querySelectorAll('.answers');
        let numCorrect = 0;

        quizData.forEach((currentQuestion, questionNumber) => {
            const answerContainer = answerContainers[questionNumber];
            const selector = `input[name=question${questionNumber}]:checked`;
            const userAnswer = (answerContainer.querySelector(selector) || {}).value;

            if (userAnswer === currentQuestion.correct) {
                numCorrect++;
                answerContainers[questionNumber].style.color = 'green';
            }
            else {
                answerContainers[questionNumber].style.color = 'red';
            }
        });
        resultContainer.innerHTML = `${numCorrect} out of ${quizData.length}`;

        if (numCorrect === quizData.length) {
                newTestButton.style.display = 'block';
            } else {
                newTestButton.style.display = 'none';
            }
        }

        function loadNewTest() {
            currentSetIndex++;
            if (currentSetIndex >= questionSets.length) {
                resultContainer.innerHTML = "No more question available!";
                newTestButton.style.display = 'none';
                return;
            }

            quizData = questionSets[currentSetIndex];
            resultContainer.innerHTML = '';
            newTestButton.style.display = 'none';
            loadQuiz();
        
    }

    loadQuiz();
    submitButton.addEventListener('click', showResults);
    newTestButton.addEventListener('click', loadNewTest);
</script>

</body>
</html>
